services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tavern_management
      POSTGRES_USER: tavern
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - tavern_db:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./database/seeds/001_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tavern -d tavern_management"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tavern:change-this-password@db:5432/tavern_management
      JWT_SECRET: replace-with-a-long-random-secret
      FRONTEND_URL: http://localhost
      TIMEZONE: Africa/Johannesburg
      CURRENCY: ZAR
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
volumes:
  tavern_db:
